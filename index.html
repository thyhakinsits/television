<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./images/ball.png" type="image/x-icon" />
    <link rel="stylesheet" href="tv.css"/>
    <title>Television</title>
</head>
<body>
    <div id="container">

        <div class="speaker speaker1"></div>
        <div class="speaker circle1"></div>
        <div class="speaker circle2"></div>

        <div id="television">
            <div id="body-screen">
                <div class="screen1"></div>
                <div id="screen2">
                        <img src="./images/stadium.png" alt="" width="170px" height="79px" class="stadium" />
                    <div id="players-ball">
                        <img src="./images/player1.png" alt="player1" width="21px" class="player1" />
                        <img src="./images/ball.png" alt="ball" width="15px" class="ball" />
                        <img src="./images/player2.png" alt="player2" width="26px" class="player2" />
                    </div>
                </div>
            </div>
            
            <div id="stand-base">
                <div class="stand-cap"></div>
                <div class="base"></div>
            </div>
        </div>

        
        <div class="speaker speaker2"></div>
        <div class="speaker speaker2-circle1"></div>
        <div class="speaker speaker2-circle2"></div>
    </div>
</body>
</html>
